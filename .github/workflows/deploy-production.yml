name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: memoflashcards-web-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to CloudFront
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      REACT_APP_API_BASE_URL: ${{ vars.REACT_APP_API_BASE_URL || 'https://mobile.memoflashcards.com' }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      S3_BUCKET: ${{ vars.S3_BUCKET }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Run tests
        run: npm test -- --watchAll=false --runInBand

      - name: Build production bundle
        env:
          CI: false
        run: npm run build

      - name: Validate production bundle
        run: test -f build/index.html

      - name: Check deployment configuration
        id: deployment_config
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$AWS_ACCOUNT_ID" || -z "$AWS_REGION" || -z "$AWS_ROLE_ARN" || -z "$S3_BUCKET" || -z "$CLOUDFRONT_DISTRIBUTION_ID" ]]; then
            echo "::notice::Deployment skipped until all AWS repository variables are configured."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Configure temporary AWS credentials
        if: steps.deployment_config.outputs.configured == 'true'
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: MemoFlashcardsWeb-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ env.AWS_ACCOUNT_ID }}

      - name: Upload application shell
        if: steps.deployment_config.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          aws s3 sync build/ "s3://$S3_BUCKET" \
            --delete \
            --exclude "static/*" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --only-show-errors

      - name: Upload immutable assets
        if: steps.deployment_config.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          aws s3 sync build/static/ "s3://$S3_BUCKET/static/" \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --only-show-errors

      - name: Invalidate CloudFront cache
        if: steps.deployment_config.outputs.configured == 'true'
        run: >-
          aws cloudfront create-invalidation
          --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID"
          --paths "/*"
